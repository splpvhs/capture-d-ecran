<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with squircle/rounded rect for maskable safe area -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Smartphone Screen outline -->
  <rect x="110" y="80" width="292" height="352" rx="28" fill="url(#screenGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Speaker notch / camera bar -->
  <rect x="220" y="96" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="304" cy="100" r="4" fill="#ef4444" />

  <!-- Capture Lens / Recording indicator -->
  <circle cx="256" cy="240" r="76" fill="#181825" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="240" r="60" fill="url(#grad)"/>
  <!-- Shutter / Record Center -->
  <circle cx="256" cy="240" r="32" fill="#ffffff"/>
  <circle cx="256" cy="240" r="16" fill="#ef4444"/>

  <!-- Capture corners overlay -->
  <path d="M 140 160 L 140 140 L 160 140" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M 372 160 L 372 140 L 352 140" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M 140 330 L 140 350 L 160 350" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M 372 330 L 372 350 L 352 350" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>

  <!-- Bottom Android home bar indicator -->
  <rect x="216" y="414" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.4"/>
</svg>
